<!DOCTYPE html>
<html lang="{{ get_locale() }}" dir="{{ 'rtl' if g.locale == 'fa' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('My Portfolio') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
    <nav>
        <ul>
            <li><a href="{{ url_for('main.index') }}">{{ _('Home') }}</a></li>
            <li><a href="#">{{ _('About') }}</a></li>
            <li><a href="#">{{ _('Blog') }}</a></li>
            <li><a href="#">{{ _('Contact') }}</a></li>
        </ul>
        <ul>
            <li><a href="{{ url_for('main.set_language', language='en') }}">English</a></li>
            <li><a href="{{ url_for('main.set_language', language='fa') }}">فارسی</a></li>
        </ul>
    </nav>
    <hr>
    {% block content %}{% endblock %}
    </div>
</body>
</html>
